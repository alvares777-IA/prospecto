<!doctype html>
<html lang="pt-BR" data-answer="1000" data-nivel="Jogo" data-titulo="Comilão">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comilão — jogoDaVida</title>
<style>
  html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font-family:system-ui,Segoe UI,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  .tela{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px}
  h1{font-size:15px;margin:0;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .hud{display:flex;gap:18px;font-size:14px;color:#cbd5e1}
  .hud b{color:#e2e8f0}
  canvas{background:#0d1224;border:1px solid #1e2a45;border-radius:10px;touch-action:none}
  .aviso{min-height:22px;font-size:14px;font-weight:600}
  .aviso.ok{color:#22c55e}
  .aviso.erro{color:#ef4444}
  .aviso.info{color:#94a3b8}
  button{background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer}
  button:disabled{background:#334155;cursor:default;opacity:.6}
  button.secundario{background:#334155}
  .botoes{display:flex;gap:8px}
  .ajuda{font-size:12px;color:#64748b;max-width:440px;text-align:center}
</style>
</head>
<body>
<div class="tela">
  <h1>Comilão</h1>
  <div class="hud">Fase: <b id="nivel">1/1</b> &nbsp;·&nbsp; Pontos: <b id="pontos">0</b> &nbsp;·&nbsp; Vidas: <b id="vidas">3</b> &nbsp;·&nbsp; Meta: <b id="meta">1000</b></div>
  <canvas id="c" width="408" height="312"></canvas>
  <div class="aviso info" id="aviso">Setas para mover. Fuja dos fantasmas e coma os pontos.</div>
  <div class="botoes">
    <button id="btnEnviar" disabled>Enviar pontuação</button>
    <button id="btnReiniciar" class="secundario">Reiniciar</button>
  </div>
  <p class="ajuda">Cada ponto comido vale 10. Ao perder as 3 vidas, ou quando quiser,
  envie a pontuação — o jogo confirma se deu para resolver o enigma.</p>
</div>
<script src="fim-jogo.js"></script>
<script>
(function () {
  const embutido = window.parent && window.parent !== window;
  const META = Number(document.documentElement.getAttribute('data-answer')) || 900;
  document.getElementById('meta').textContent = META;

  const CELL = 24, COLS = 17, ROWS = 13;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');

  // A física acima usa a grade COLS×ROWS fixa (= cv.width/height); só o
  // TAMANHO NA TELA estica pra aproveitar o espaço disponível (tela cheia). A
  // folga vertical é medida de verdade (título, HUD, botões, texto de ajuda)
  // em vez de um número fixo — senão, em tela cheia, o canvas cresce demais
  // e empurra os botões pra fora da área visível (só "voltam" ao apertar Esc).
  function ajustarTamanho() {
    const tela = document.querySelector('.tela');
    const folga = [...tela.children].filter(el => el !== cv)
        .reduce((soma, el) => soma + el.offsetHeight, 0)
      + tela.children.length * 8 + 28 + 16;   // gaps + padding + margem
    const escala = Math.min((window.innerWidth - 24) / cv.width, (window.innerHeight - folga) / cv.height);
    cv.style.width = Math.round(cv.width * Math.max(escala, 0.3)) + 'px';
    cv.style.height = Math.round(cv.height * Math.max(escala, 0.3)) + 'px';
  }
  window.addEventListener('resize', ajustarTamanho);
  ajustarTamanho();

  const $pontos = document.getElementById('pontos'), $vidas = document.getElementById('vidas');
  const $aviso = document.getElementById('aviso');
  const $btnEnviar = document.getElementById('btnEnviar'), $btnReiniciar = document.getElementById('btnReiniciar');

  // Labirinto: borda de parede + "pilares" isolados, espaçados o bastante
  // (nunca colados uns nos outros nem enchendo uma linha/coluna inteira) pra
  // nenhuma célula ficar bloqueada nos dois lados do mesmo eixo ao mesmo
  // tempo — garante chão conectado E sempre com alguma liberdade lateral,
  // sem cantinho onde o fantasma não alcança.
  // Um labirinto por nível (alterna). Todos seguem a mesma regra dos pilares
  // isolados — nenhum encosta em outro — e nenhum cai numa posição de partida.
  const LABIRINTOS = [
    { linhas: [3, 6, 9], colunas: [3, 6, 9, 12] },
    { linhas: [3, 6, 9], colunas: [2, 5, 8, 11, 14] },
    { linhas: [2, 4, 6, 8, 10], colunas: [3, 6, 9, 12] },
  ];
  let labirinto = LABIRINTOS[0];
  function paredeFixa(r, c) {
    if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) return true;
    return labirinto.linhas.includes(r) && labirinto.colunas.includes(c);
  }

  const START_JOGADOR = { r: 6, c: 1 };
  // 2 fantasmas no nível 1; +1 por nível a partir do 2 (até 4)
  const TODOS_FANTASMAS = [
    { r: 6, c: 7, cor: '#ef4444' },
    { r: 2, c: 13, cor: '#f472b6' },
    { r: 10, c: 13, cor: '#22d3ee' },
    { r: 10, c: 4, cor: '#fb923c' },
  ];
  let START_FANTASMAS = TODOS_FANTASMAS.slice(0, 2);

  let mapa, pontos, vidas, jogador, fantasmas, fimDeJogo, resolvido, totalPontos;
  let nivel = 1, niveis = 1, pausaAte = 0;
  const $nivel = document.getElementById('nivel');

  function celulaChao(r, c) { return !paredeFixa(r, c); }

  function novoMapa() {
    mapa = [];
    let total = 0;
    for (let r = 0; r < ROWS; r++) {
      mapa[r] = [];
      for (let c = 0; c < COLS; c++) {
        if (paredeFixa(r, c)) { mapa[r][c] = '#'; continue; }
        const ehInicio = (r === START_JOGADOR.r && c === START_JOGADOR.c) ||
          START_FANTASMAS.some(f => f.r === r && f.c === c);
        mapa[r][c] = ehInicio ? ' ' : '.';
        if (mapa[r][c] === '.') total++;
      }
    }
    return total;
  }

  function novaEntidade(pos, vel) {
    return { r: pos.r, c: pos.c, x: pos.c * CELL, y: pos.r * CELL, dx: 0, dy: 0, ang: 0, prox: null, vel };
  }

  function novoJogo() {
    FimJogo.esconder();
    pontos = 0; vidas = 3; nivel = 1; fimDeJogo = false; resolvido = false;
    iniciarNivel();
    avisar('Setas para mover. Fuja dos fantasmas e coma os pontos.', 'info');
    $btnEnviar.disabled = true;
    atualizarHud();
  }

  function iniciarNivel() {
    labirinto = LABIRINTOS[(nivel - 1) % LABIRINTOS.length];
    START_FANTASMAS = TODOS_FANTASMAS.slice(0, Math.min(2 + (nivel - 1), TODOS_FANTASMAS.length));
    totalPontos = novoMapa();
    // Velocidade tem que DIVIDIR CELL exatamente (24 / 2 = 12, 24 / 1.5 = 16).
    // Com um valor que não divide (2.1, 1.7 antes), o passo pula por cima da
    // margem de alinhamento na maioria das células — e é só nesse alinhamento
    // que o jogo checa parede e ponto. Resultado: ele passava direto por
    // pontos e atravessava até a borda, porque o "freio" nunca disparava.
    jogador = novaEntidade(START_JOGADOR, 2);
    // a partir do nível 2 os fantasmas andam na velocidade do jogador (2 divide 24)
    const velFantasma = nivel >= 2 ? 2 : 1.5;
    fantasmas = START_FANTASMAS.map(f => Object.assign(novaEntidade(f, velFantasma), { cor: f.cor }));
    pausaAte = performance.now() + 1000;
  }

  function nivelCompleto() {
    if (nivel >= niveis) { terminar(true); return; }
    pontos += 50; nivel++; atualizarHud(); somVitoria();
    avisar(`Fase ${nivel - 1} completa! +50. Fase ${nivel}: fantasmas mais rápidos.`, 'ok');
    iniciarNivel();
  }

  function atualizarHud() { $pontos.textContent = pontos; $vidas.textContent = vidas; $nivel.textContent = nivel + '/' + niveis; }
  function avisar(t, tipo) { $aviso.className = 'aviso ' + (tipo || 'info'); $aviso.textContent = t; }

  // ── som (WebAudio sintetizado, sem arquivo) ──
  let actx = null;
  function iniciarAudio() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (err) {}
  }
  function bip(freq, dur, atraso, tipo) {
    iniciarAudio();
    if (!actx) return;
    try {
      const t = actx.currentTime + (atraso || 0);
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = tipo || 'square'; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (err) {}
  }
  function somComer() { bip(880, 0.045); }
  function somMorte() { bip(300, 0.14, 0, 'sawtooth'); bip(180, 0.22, 0.12, 'sawtooth'); bip(90, 0.28, 0.26, 'sawtooth'); }
  function somVitoria() { bip(523, 0.09); bip(659, 0.09, 0.09); bip(784, 0.09, 0.18); bip(1047, 0.2, 0.27); }
  function somFim() { bip(320, 0.14); bip(220, 0.24, 0.12); }
  document.addEventListener('pointerdown', iniciarAudio, true);
  document.addEventListener('keydown', iniciarAudio, true);

  function alinhado(e) {
    return Math.abs(e.x - Math.round(e.x / CELL) * CELL) < 0.6 &&
           Math.abs(e.y - Math.round(e.y / CELL) * CELL) < 0.6;
  }
  function podeIr(r, c, dr, dc) {
    const nr = r + dr, nc = c + dc;
    return nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && mapa[nr][nc] !== '#';
  }

  const DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];

  function moverJogador() {
    const e = jogador;
    if (alinhado(e)) {
      e.r = Math.round(e.y / CELL); e.c = Math.round(e.x / CELL);
      e.x = e.c * CELL; e.y = e.r * CELL;
      // prox e DIRS guardam [dr, dc] (linha, coluna); dx/dy do movimento são
      // [coluna, linha] (eixo x, eixo y) — por isso a troca de índices aqui.
      if (e.prox && podeIr(e.r, e.c, e.prox[0], e.prox[1])) { e.dx = e.prox[1]; e.dy = e.prox[0]; }
      else if (!podeIr(e.r, e.c, e.dy, e.dx)) { e.dx = 0; e.dy = 0; }
      // a boca (desenho) acompanha pra onde ele está indo de verdade — sem
      // isso ele "comia de costas" ao virar pra esquerda/cima/baixo, porque
      // o desenho sempre abria a boca pro mesmo lado (direita).
      if (e.dx || e.dy) e.ang = e.dx > 0 ? 0 : e.dx < 0 ? Math.PI : (e.dy > 0 ? Math.PI / 2 : -Math.PI / 2);
      if (mapa[e.r][e.c] === '.') {
        mapa[e.r][e.c] = ' '; pontos += 10; atualizarHud();
        $btnEnviar.disabled = pontos <= 0;
        somComer();
      }
    }
    e.x += e.dx * e.vel; e.y += e.dy * e.vel;
  }

  function moverFantasma(f) {
    if (alinhado(f)) {
      f.r = Math.round(f.y / CELL); f.c = Math.round(f.x / CELL);
      f.x = f.c * CELL; f.y = f.r * CELL;
      const opcoes = DIRS.filter(([dr, dc]) => podeIr(f.r, f.c, dr, dc) && !(dr === -f.dy && dc === -f.dx));
      const validas = opcoes.length ? opcoes : DIRS.filter(([dr, dc]) => podeIr(f.r, f.c, dr, dc));
      let escolha;
      if (Math.random() < 0.75) {
        escolha = validas.slice().sort((a, b) => {
          const da = Math.hypot(f.c + a[1] - jogador.c, f.r + a[0] - jogador.r);
          const db = Math.hypot(f.c + b[1] - jogador.c, f.r + b[0] - jogador.r);
          return da - db;
        })[0];
      } else {
        escolha = validas[Math.floor(Math.random() * validas.length)];
      }
      if (escolha) { f.dx = escolha[1]; f.dy = escolha[0]; }
    }
    f.x += f.dx * f.vel; f.y += f.dy * f.vel;
  }

  function colidiu(a, b) { return Math.hypot(a.x - b.x, a.y - b.y) < CELL * 0.6; }

  function perderVida() {
    vidas--; atualizarHud(); somMorte();
    jogador.r = START_JOGADOR.r; jogador.c = START_JOGADOR.c;
    jogador.x = START_JOGADOR.c * CELL; jogador.y = START_JOGADOR.r * CELL;
    jogador.dx = 0; jogador.dy = 0; jogador.prox = null;
    fantasmas.forEach((f, i) => {
      const s = START_FANTASMAS[i];
      f.r = s.r; f.c = s.c; f.x = s.c * CELL; f.y = s.r * CELL; f.dx = 0; f.dy = 0;
    });
    if (vidas <= 0) terminar(false);
    else avisar('Um fantasma te pegou! Vidas restantes: ' + vidas + '.', 'erro');
  }

  function terminar(comeuTudo) {
    if (fimDeJogo) return;
    fimDeJogo = true;
    avisar((comeuTudo ? 'Comeu tudo! ' : 'Fim de jogo. ') + 'Pontuação final: ' + pontos + '.', comeuTudo ? 'ok' : 'info');
    if (comeuTudo) somVitoria(); else somFim();
    FimJogo.mostrar({
      venceu: comeuTudo, pontos, meta: META, embutido,
      titulo: comeuTudo ? 'Comilão completado!' : 'Fim de jogo',
      detalhe: comeuTudo ? `Comeu tudo em ${niveis} fase(s).` : `Os fantasmas te pegaram na fase ${nivel}.`,
      aoEnviar: enviarTentativa, aoRepetir: novoJogo,
    });
  }

  function enviarTentativa() {
    if (resolvido) return;
    if (!embutido) { avisar('Abra este jogo pelo jogoDaVida para valer.', 'erro'); return; }
    window.parent.postMessage({ tipo: 'tentativa', valor: String(pontos) }, location.origin);
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    const d = e.data || {};
    if (d.tipo === 'config') {
      if (Number.isFinite(d.valores?.niveis) && d.valores.niveis >= 1) niveis = Math.floor(d.valores.niveis);
      atualizarHud();
      return;
    }
    if (d.tipo !== 'resultado') return;
    FimJogo.resultado(!!d.correto);
    if (d.correto) {
      resolvido = true;
      avisar('✓ Resolvido! Pontuação ' + pontos + ' (meta ' + META + ').', 'ok');
      $btnEnviar.disabled = true;
    } else {
      avisar('Ainda não chegou na meta (' + META + '). Continue comendo ou reinicie.', 'erro');
      $btnEnviar.disabled = pontos <= 0;
    }
  });

  window.addEventListener('keydown', function (e) {
    const mapa2 = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] };
    if (mapa2[e.key]) { e.preventDefault(); jogador.prox = mapa2[e.key]; }
  });
  $btnEnviar.addEventListener('click', enviarTentativa);
  $btnReiniciar.addEventListener('click', novoJogo);

  function restamPontos() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (mapa[r][c] === '.') return true;
    return false;
  }

  function passo() {
    if (!fimDeJogo && performance.now() >= pausaAte) {
      moverJogador();
      fantasmas.forEach(moverFantasma);
      for (const f of fantasmas) if (colidiu(f, jogador)) { perderVida(); break; }
      if (!fimDeJogo && !restamPontos()) nivelCompleto();
    }

    ctx.clearRect(0, 0, COLS * CELL, ROWS * CELL);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (mapa[r][c] === '#') { ctx.fillStyle = '#1e2a45'; ctx.fillRect(c * CELL, r * CELL, CELL, CELL); }
        else if (mapa[r][c] === '.') {
          ctx.fillStyle = '#facc15'; ctx.beginPath();
          ctx.arc(c * CELL + CELL / 2, r * CELL + CELL / 2, 3, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    ctx.save();
    ctx.translate(jogador.x + CELL / 2, jogador.y + CELL / 2);
    ctx.rotate(jogador.ang);
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath(); ctx.arc(0, 0, CELL * 0.4, 0.25 * Math.PI, 1.75 * Math.PI); ctx.lineTo(0, 0); ctx.fill();
    ctx.restore();
    for (const f of fantasmas) {
      ctx.fillStyle = f.cor;
      ctx.beginPath(); ctx.arc(f.x + CELL / 2, f.y + CELL / 2, CELL * 0.4, Math.PI, 0); ctx.lineTo(f.x + CELL * 0.9, f.y + CELL * 0.8); ctx.lineTo(f.x + CELL * 0.1, f.y + CELL * 0.8); ctx.fill();
    }
    if (performance.now() < pausaAte && !fimDeJogo) {
      ctx.fillStyle = 'rgba(13,18,36,.75)'; ctx.fillRect(0, ROWS * CELL / 2 - 26, COLS * CELL, 52);
      ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 24px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(`Fase ${nivel}`, COLS * CELL / 2, ROWS * CELL / 2 + 8); ctx.textAlign = 'start';
    }

    requestAnimationFrame(passo);
  }

  if (!embutido) avisar('Abra este jogo pelo jogoDaVida para valer a pena.', 'erro');
  novoJogo();
  if (embutido) window.parent.postMessage({ tipo: 'pedir_config' }, location.origin);
  requestAnimationFrame(passo);
})();
</script>
</body></html>
