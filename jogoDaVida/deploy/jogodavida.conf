# ──────────────────────────────────────────────────────────────
# jogoDaVida — VirtualHost Apache para jogodavida.rssc.com.br
# Proxy reverso para o container (127.0.0.1:3004), com upgrade de
# WebSocket (o Socket.IO precisa).
#
# Deploy (no servidor):
#   1. DNS: registro A  jogodavida.rssc.com.br -> IP do servidor
#   2. Módulos Apache:  proxy, proxy_http, proxy_wstunnel, headers, rewrite, ssl
#        httpd -M | grep -E 'wstunnel|headers|rewrite'
#   3. Copiar este arquivo para /etc/httpd/conf.d/jogodavida.conf
#   4. IMPORTANTE: antes de rodar o certbot, remova/comente o bloco
#      <IfModule mod_ssl.c>...:443...</IfModule> abaixo — ele referencia um
#      certificado que ainda não existe e o `apachectl configtest` falha com
#      "SSLCertificateFile: file ... does not exist". Deixe só o VirtualHost
#      :80, dê configtest + reload, e SÓ DEPOIS rode:
#        sudo certbot --apache -d jogodavida.rssc.com.br
#      O certbot valida via HTTP (usa o ProxyPass /.well-known/ ! abaixo,
#      que libera esse caminho sem proxiar) e cria o bloco :443 sozinho,
#      com os caminhos corretos do certificado.
#   4b. O certbot também costuma inserir no fim do bloco :80 um redirect
#      forçado para https (RewriteCond %{SERVER_NAME}=... / RewriteRule
#      ^ https://...). REMOVA essas 2 linhas: o proxy externo (Nginx Proxy
#      Manager em 192.168.210.8) já termina o HTTPS público e encaminha
#      pro Apache em HTTP puro na porta 80 (mesmo padrão dos outros
#      subdomínios) — com o redirect forçado ali, vira loop infinito
#      (ERR_TOO_MANY_REDIRECTS). Rodar de novo `apachectl configtest` +
#      `systemctl reload httpd` depois de remover.
#   5. No docker-compose, para produção, sobrepor no serviço `jogodavida`:
#        NODE_ENV=production          (cookie de sessão Secure)
#        JV_APP_URL=https://jogodavida.rssc.com.br   (callback do Google)
#      e liberar essa redirect URI no Google Cloud Console.
#   6. systemctl reload httpd   (após `apachectl configtest` OK)
# ──────────────────────────────────────────────────────────────

<VirtualHost *:80>
    ServerName jogodavida.rssc.com.br

    ProxyPreserveHost On

    # Libera path de validação do Certbot (não proxiar)
    ProxyPass /.well-known/ !

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3004/$1 [P,L]

    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:3004/
    ProxyPassReverse / http://127.0.0.1:3004/

    ErrorLog  /var/log/httpd/jogodavida-error.log
    CustomLog /var/log/httpd/jogodavida-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName jogodavida.rssc.com.br

    ProxyPreserveHost On

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3004/$1 [P,L]

    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:3004/
    ProxyPassReverse / http://127.0.0.1:3004/

    ErrorLog  /var/log/httpd/jogodavida-error.log
    CustomLog /var/log/httpd/jogodavida-access.log combined

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/jogodavida.rssc.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/jogodavida.rssc.com.br/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
