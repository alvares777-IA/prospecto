<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Vida — protótipo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <main class="container py-4" style="max-width: 640px">

    <!-- 1. NOME + FIGURA -->
    <section id="tela-entrada">
      <h1 class="h4 mb-1">Jogo da Vida</h1>
      <p class="text-secondary small mb-4">Era: <span id="rotulo-era">…</span></p>

      <div class="mb-3">
        <label for="campo-nome" class="form-label">Seu nome</label>
        <input type="text" id="campo-nome" class="form-control" maxlength="64"
               autocomplete="off" placeholder="como querem te chamar aqui">
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Escolha uma figura</label>
        <div id="grade-avatares" class="d-flex flex-wrap gap-2">
          <span class="text-secondary small">carregando…</span>
        </div>
      </div>

      <div id="erro-entrada" class="alert alert-danger py-2 d-none" role="alert"></div>
      <button id="btn-continuar" class="btn btn-primary">Continuar</button>
    </section>

    <!-- 2. CRIAR OU ENTRAR NUMA SALA -->
    <section id="tela-sala-escolha" class="d-none">
      <h1 class="h4 mb-4">Onde você quer jogar?</h1>

      <button id="btn-criar" class="btn btn-primary w-100 mb-4">Criar uma sala nova</button>

      <div class="divisor mb-4"><span>ou entrar na sala de um amigo</span></div>

      <div class="d-flex gap-2">
        <input type="text" id="campo-codigo" class="form-control text-uppercase"
               maxlength="5" autocomplete="off" placeholder="código (ex.: K7Q2M)">
        <button id="btn-entrar-sala" class="btn btn-outline-light">Entrar</button>
      </div>

      <div id="erro-sala" class="alert alert-danger py-2 mt-3 d-none" role="alert"></div>
    </section>

    <!-- 3. DENTRO DA SALA -->
    <section id="tela-sala" class="d-none">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
        <p class="mb-0">
          Você entrou como <strong id="eu-nome"></strong>
          <img id="eu-avatar" width="24" height="24" alt="" class="align-text-bottom ms-1">
        </p>
        <div class="text-end small">
          <span class="text-secondary">Sala</span>
          <span id="rotulo-codigo" class="badge text-bg-secondary fs-6"></span>
          <button id="btn-copiar" class="btn btn-sm btn-outline-secondary ms-1">copiar link</button>
        </div>
      </div>
      <p class="text-secondary small" id="status-conexao">conectando…</p>

      <hr>
      <p class="mb-1">Na sala: <span id="contador-presentes">0</span></p>
      <ul id="lista-presentes" class="list-unstyled"></ul>

      <hr>
      <div id="chat" class="chat-log mb-2"></div>
      <form id="form-msg" class="d-flex gap-2">
        <input id="campo-msg" class="form-control" maxlength="500"
               autocomplete="off" placeholder="mensagem…">
        <button class="btn btn-outline-light" type="submit">Enviar</button>
      </form>
    </section>

  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
